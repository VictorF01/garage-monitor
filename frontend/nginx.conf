server {
  listen 80;
  root /usr/share/nginx/html;
  # Um pouco acima do limite do backend (MAX_UPLOAD_MB) por causa do overhead do multipart.
  client_max_body_size 105m;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    # A análise do manual pelo Claude pode levar alguns minutos.
    proxy_read_timeout 600s;
  }

  location / {
    try_files $uri /index.html;
  }
}
